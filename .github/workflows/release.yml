name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cross-compile for Linux
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release --workspace

      - name: Cross-compile for macOS
        if: matrix.target == 'x86_64-apple-darwin'
        run: cargo build --release --workspace

      - name: Cross-compile for Windows
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/setup-go@v5
        run: |
          go install github.com/curlup/cargo-xwin@latest
          . "$HOME/.cargo/env"
          cargo xwin build --release --workspace --target x86_64-pc-windows-msvc

      - name: Package artifacts
        run: |
          mkdir -p dist
          find target/release -maxdepth 1 -type f \( -name '*.exe' -o ! -name '*.d' -o ! -name '*.pdb' \) -size +0c -not -name '*.dll' -not -name '*.dll.a' -not -name 'lib*' | while read f; do
            cp "$f" dist/
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbstudio-${{ matrix.target }}
          path: dist/

  sign-and-release:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten artifacts
        run: |
          find dist -type f -exec mv {} dist/ \;
          rmdir dist/*/ 2>/dev/null || true

      - name: Create checksums
        run: sha256sum dist/* > dist/checksums.txt

      - name: Sign checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --detach-sign --armor --output dist/checksums.txt.asc dist/checksums.txt
          echo "GPG_PRIVATE_KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec:' | cut -d: -f5)" >> $GITHUB_ENV

      - name: Generate SBOM
        uses: anchore/sbom-action@v3
        with:
          output: dist/sbom.spdx.json
          format: spdx-json
          artifact-type: project

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: dbstudio ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
